# Fork pull requests receive neither secrets nor an OIDC token, so run the check where the job has them:
# in the merge queue, on the base repository, or on push to the default branch.
name: migration-safety
on:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write          # evaluation; omit when passing a paid license
jobs:
  presift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nishu-sde/presift@v1
        with:
          paths: db/migrations
