# Fork pull requests do not receive repository secrets, so run the check where the secret exists:
# in the merge queue, on the base repository, or on push to the default branch.
name: migration-safety
on:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nishu-sde/presift@v1
        with:
          paths: db/migrations
          license: ${{ secrets.PRESIFT_LICENSE }}
