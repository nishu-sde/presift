# Report findings in the repository's code-scanning view instead of failing the step.
name: migration-safety
on: [pull_request]
permissions:
  contents: read
  security-events: write
  id-token: write          # evaluation; omit when passing a paid license
jobs:
  presift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nishu-sde/presift@v1
        with:
          paths: db/migrations
          fail-on: never          # let code scanning carry the signal
          sarif-file: presift.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: presift.sarif
