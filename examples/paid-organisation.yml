# Paid organisation: the annual key is stored as a secret and passed as `license`; it takes precedence
# over the evaluation, so `id-token: write` is not needed.
name: migration-safety
on: [pull_request]
permissions:
  contents: read
jobs:
  presift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nishu-sde/presift@v1
        with:
          paths: db/migrations
          fail-on: error
          license: ${{ secrets.PRESIFT_LICENSE }}
